<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f9d55">
<meta name="description" content="The quickest way across Jalandhar, Ludhiana, Amritsar and Phagwara with the fewest red lights — through galiyan when it is faster.">
<title>Green Route</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;800&family=Noto+Sans+Devanagari:wght@400;600;800&family=Noto+Sans+Gurmukhi:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
<aside id="panel">
  <button class="handle" id="handle" aria-label="Show or hide details"></button>
  <h1 class="more"><span class="lamp"><i></i><i></i><i></i></span><span data-i18n="title">Green Route</span></h1>
  <div class="trip">
    <span class="pt" style="background:var(--green)"></span>
    <div class="field"><input id="qA" data-i18n-ph="from_ph" autocomplete="off" aria-label="From"><div class="drop" id="dA" hidden></div></div>
    <button class="ib" id="locA" aria-label="Start from my location" title="My location">◎</button>
    <span class="line"></span><span></span><button class="ib sm" id="swap" aria-label="Swap start and end" title="Swap">⇅</button>
    <span class="pt" style="background:var(--red)"></span>
    <div class="field"><input id="qB" data-i18n-ph="to_ph" autocomplete="off" aria-label="To"><div class="drop" id="dB" hidden></div></div>
    <button class="ib mic" id="mic" aria-label="Voice search" title="Voice search">🎤</button>
  </div>
  <div class="quick" id="quick" hidden></div>
  <div class="opts">
    <div class="seg" id="vehSeg" role="group" aria-label="How are you travelling?"><button data-v="car" data-i18n="car">🚗 Car</button><button data-v="bike" data-i18n="bike">🛵 Bike</button><button data-v="cycle" data-i18n="cycle">🚲 Cycle</button><button data-v="walk" data-i18n="walk">🚶 Walk</button></div>
    <label class="trsel" id="trWrap"><span data-i18n="traffic_lbl">Traffic</span><select id="trSel" aria-label="Main-road traffic"><option value="auto">Auto</option><option value="light" data-i18n="tr_light_cap">Light</option><option value="normal" data-i18n="tr_normal_cap">Normal</option><option value="heavy" data-i18n="tr_heavy_cap">Heavy</option></select></label>
  </div>
  <div id="result"></div>
  <div id="status"></div>
  <div class="card more" id="savings"></div>
  <div class="more legend">
    <span><i class="dot" style="background:var(--red)"></i><span data-i18n="legend_sure">Red light (confirmed)</span></span>
    <span><i class="dot" style="background:var(--amber)"></i><span data-i18n="legend_likely">Likely red light</span></span>
    <span>📷 <span data-i18n="legend_cam">Camera</span></span>
  </div>
  <details class="more" id="settings">
    <summary data-i18n="settings">Settings, places and fixes</summary>
    <div class="set">
      <div class="grid3">
        <label><span data-i18n="city">City</span><select id="citySel"><option value="jalandhar" data-i18n="jalandhar">Jalandhar</option><option value="ludhiana" data-i18n="ludhiana">Ludhiana</option><option value="amritsar" data-i18n="amritsar">Amritsar</option><option value="phagwara" data-i18n="phagwara">Phagwara</option></select></label>
        <label><span data-i18n="language">Language</span><select id="langSel"><option value="en">English</option><option value="hi">हिन्दी</option><option value="pa">ਪੰਜਾਬੀ</option></select></label>
        <label><span data-i18n="theme">Map colours</span><select id="themeSel"><option value="auto" data-i18n="theme_auto">Auto</option><option value="light" data-i18n="theme_light">Light</option><option value="dark" data-i18n="theme_dark">Dark</option></select></label>
      </div>
      <div class="row"><div><b data-i18n="voice_lbl">Voice directions</b><small data-i18n="voice_sub"></small></div><input type="checkbox" class="sw" id="voice" aria-label="Voice directions"></div>
      <div class="row"><div><b data-i18n="likely_lbl">Count likely red lights</b><small data-i18n="likely_sub"></small></div><input type="checkbox" class="sw" id="likely" aria-label="Count likely red lights"></div>
      <div>
        <div class="row"><label for="wait"><b data-i18n="wait_lbl">Average wait at a red light</b></label><b id="wv">45 s</b></div>
        <input type="range" id="wait" min="10" max="150" step="5" value="45">
        <small data-i18n="wait_sub"></small>
      </div>
      <div><b data-i18n="places_title">Saved places</b><div id="placesList"></div></div>
      <div><b data-i18n="reports_title">Shared reports</b><small id="repState"></small></div>
      <div>
        <b data-i18n="fix_title">Fix red lights</b>
        <small data-i18n="fix_sub"></small>
        <div class="tools"><button id="edit" data-i18n="fix_lights">Fix red lights</button><button id="copyfix" data-i18n="copy_fixes">Copy my fixes</button></div>
      </div>
      <div class="tools">
        <button id="area" data-i18n="area_btn">Load roads for this map view</button>
        <button id="clear" data-i18n="clear_btn">Clear trip</button>
        <button id="install" data-i18n="install_btn" hidden>Install app</button>
      </div>
      <div class="legend phone-legend">
        <span><i class="dot" style="background:var(--red)"></i><span data-i18n="legend_sure"></span></span>
        <span><i class="dot" style="background:var(--amber)"></i><span data-i18n="legend_likely"></span></span>
        <span>📷 <span data-i18n="legend_cam"></span></span>
      </div>
      <p class="note" data-i18n="note"></p>
    </div>
  </details>
</aside>
<div id="mapwrap">
  <div id="map"></div>
  <div class="hint" id="hint" hidden></div>
  <button class="fab" id="me" aria-label="Show my location" title="My location">◎</button>
  <button class="fab rep-fab" id="repBtn" aria-label="Report" title="Report">⚠️</button>
</div>
</div>

<div id="navTop" class="navui">
  <div class="arrow" id="navArrow">↑</div>
  <div class="ntext"><div class="ndist" id="navDist"></div><div id="navText"></div><small id="navThen"></small></div>
</div>
<div id="navBottom" class="navui">
  <div id="navLeft"></div>
  <div class="nbtns">
    <button id="navCenter" hidden aria-label="Re-centre">◎</button>
    <button id="navReport" aria-label="Report">⚠️</button>
    <button id="navMute" aria-label="Voice on or off">🔊</button>
    <button id="navStop" class="stop" data-i18n="stop">Stop</button>
  </div>
</div>

<div class="sheet" id="repSheet" hidden role="dialog" aria-modal="true">
  <div class="box"><b data-i18n="report_title">What do you see?</b><div class="grid"></div><button id="repCancel" data-i18n="cancel">Cancel</button></div>
</div>
<div class="sheet" id="repWhere" hidden role="dialog" aria-modal="true">
  <div class="box"><b data-i18n="report_where">Where is it?</b><div class="tools"><button id="repHere" data-i18n="rep_here">At my location</button><button id="repMap" data-i18n="rep_map">Pick on map</button></div><button id="repCancel2" data-i18n="cancel">Cancel</button></div>
</div>
<div class="sheet" id="micSheet" hidden role="dialog" aria-modal="true">
  <div class="box mic-box"><div class="pulse">🎤</div><b id="micState"></b><div id="micText" class="mictext"></div><button id="micCancel" data-i18n="cancel">Cancel</button></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/i18n.js"></script>
<script src="js/core.js"></script>
<script src="js/app.js"></script>
</body>
</html>
