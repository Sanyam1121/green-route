name: Publish site

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Update map data", "Update places (Overture Maps)", "Update lane widths", "Update traffic lights (Mapillary)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Copy main to the gh-pages branch (served by GitHub Pages)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push -f origin HEAD:gh-pages
