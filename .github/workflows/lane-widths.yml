name: Update lane widths

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/lane_widths.py', '.github/workflows/lane-widths.yml']
  schedule:
    - cron: '11 21 3 * *' # monthly, 4th of the month 02:41 IST

permissions:
  contents: write

concurrency:
  group: lane-widths
  cancel-in-progress: false

jobs:
  widths:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install overturemaps shapely numpy pyarrow
      - name: Estimate street widths from the gaps between buildings
        run: python scripts/lane_widths.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update lane widths"
          git pull --rebase origin main
          git push
