name: Update map data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/fetch-data.mjs', '.github/workflows/update-data.yml']
  schedule:
    - cron: '17 21 * * 0' # weekly, Monday 02:47 IST

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download roads and signals from OpenStreetMap
        run: node scripts/fetch-data.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add Overture Maps places
        continue-on-error: true
        run: pip install duckdb==1.1.3 && python scripts/overture_places.py
      - name: Commit data if it changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update map data"
          git pull --rebase origin main
          git push
