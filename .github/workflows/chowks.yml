name: Update chowks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/chowks.mjs', '.github/workflows/chowks.yml']
  workflow_run:
    workflows: ["Update places (Overture Maps)"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: chowks
  cancel-in-progress: false

jobs:
  chowks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Find and name every chowk
        run: node scripts/chowks.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update chowks"
          git pull --rebase origin main
          git push
