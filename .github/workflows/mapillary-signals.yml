name: Update traffic lights (Mapillary)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/mapillary_signals.mjs', '.github/workflows/mapillary-signals.yml']
  schedule:
    - cron: '23 21 * * 3' # weekly, Thursday 02:53 IST

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download traffic lights seen in Mapillary photos
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
        run: node scripts/mapillary_signals.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update traffic lights from Mapillary"
          git pull --rebase origin main
          git push
