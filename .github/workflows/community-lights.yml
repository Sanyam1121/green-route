name: Collect traffic lights marked by users

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *' # every 3 hours (marks wait on ntfy.sh for 12 hours)

permissions:
  contents: write

concurrency:
  group: community-lights
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect marks
        run: node scripts/collect_lights.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Traffic lights marked by users"
          git pull --rebase origin main
          git push
